[package]
name = "g_math_inference"
version = "0.1.0"
edition = "2021"
description = "TQ1.9 and five-trit ternary inference kernels over g_math fixed-point formats"
authors = ["Niels Erik Toren"]
license-file = "LICENSE"
repository = "https://github.com/nierto/g_math_inference"
readme = "README.md"
keywords = ["ternary", "quantization", "inference", "fixed-point", "no-float"]
categories = ["mathematics", "science"]
exclude = ["differential/", "scripts/"]

[dependencies]
g_math = "0.7"
rayon = "1.10"

[profile.release]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gmath_all_splits)'] }
